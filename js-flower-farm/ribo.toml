[cell]
name = "flower-farm"
js   = "./cell.js"

# C3 database — stores live flower stock and visitor waitlist.
[[bindings]]
type     = "c3"
binding  = "DB"
database = "flower-farm"

# Static assets: CSS, images, and inner pages (flowers, about, 404).
[[bindings]]
type    = "files"
binding = "FILES"
dir     = "./public"

# The admin secret for POST /stock, GET /admin and GET /admin/waitlist. Set it
# BEFORE deploying; until it is set those routes answer 503 for everyone.
#   ribo vault set flower-farm STOCK_SECRET
[[bindings]]
type    = "vault"
binding = "STOCK_SECRET"

# Live at https://flower-farm.bestow-75.tissue.dev
